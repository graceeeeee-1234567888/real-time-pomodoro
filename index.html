<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>计时器 / 直白版</title>
<style>
  :root { --black:#000; --white:#fff; --blue:#002FA7; --paper:#f7f7f2; }
  * { box-sizing:border-box; }
  html { background:var(--white); color:var(--black); font-family: "Courier New", "Microsoft YaHei", monospace; }
  body { margin:0; min-width:320px; border-left:14px solid var(--black); border-right:14px solid var(--black); }
  button,input,select { font:inherit; color:var(--black); border-radius:0; }
  button { background:var(--white); border:3px solid var(--black); padding:9px 12px; font-weight:700; cursor:pointer; }
  button:hover, button[aria-pressed="true"], button.primary { background:var(--blue); color:var(--white); }
  button:focus-visible,input:focus-visible,select:focus-visible { outline:4px solid var(--blue); outline-offset:3px; }
  input,select { width:100%; background:var(--white); border:2px solid var(--black); min-height:43px; padding:7px; }
  h1,h2,p { margin:0; }
  h1 { font-size:clamp(48px,10vw,148px); letter-spacing:-.12em; line-height:.8; max-width:8ch; }
  h2 { font-size:clamp(23px,3vw,42px); letter-spacing:-.08em; line-height:.95; }
  .masthead { min-height:285px; padding:28px 30px; display:grid; grid-template-columns:1fr auto; gap:25px; align-items:start; border-bottom:8px solid var(--black); background:var(--paper); }
  .masthead p { margin-top:24px; max-width:20ch; font-size:14px; line-height:1.25; }
  .nav { display:flex; flex-wrap:wrap; gap:0; max-width:390px; justify-content:flex-end; }
  .nav button { margin:-3px 0 0 -3px; min-height:42px; }
  .rail { padding:8px 30px; border-bottom:3px solid var(--black); font-size:12px; font-weight:bold; overflow:auto; white-space:nowrap; }
  .rail span { margin-right:24px; }
  .board { display:grid; grid-template-columns:minmax(260px,1fr) minmax(350px,1.55fr) minmax(270px,.85fr); gap:0; padding:0 30px 80px; }
  .card { min-width:0; border:4px solid var(--black); background:var(--white); margin-top:32px; }
  .clock-card { margin-right:-4px; transform:translateY(35px); }
  .timer-card { z-index:1; }
  .reminder-card { margin-left:-4px; transform:translateY(89px); }
  .card-head { padding:13px; display:flex; justify-content:space-between; align-items:center; border-bottom:3px solid var(--black); background:var(--black); color:var(--white); }
  .tools { display:flex; gap:5px; }
  .tools button { min-height:28px; min-width:28px; padding:0 7px; border-color:var(--white); color:var(--white); background:var(--black); }
  .tools button:hover { color:var(--black); background:var(--white); }
  .body { padding:24px 20px 27px; }
  .card.collapsed .body { display:none; }
  .clock-face { padding:52px 0 40px; font-size:clamp(42px,6.6vw,74px); font-variant-numeric:tabular-nums; letter-spacing:-.12em; white-space:nowrap; }
  .clock-meta { border-top:2px solid var(--black); padding-top:10px; font-size:12px; display:flex; justify-content:space-between; }
  .tabs { display:grid; grid-template-columns:1fr 1fr; margin-bottom:24px; }
  .tabs button { border-width:3px; margin-right:-3px; }
  .fields { display:flex; gap:8px; align-items:end; }
  .field { min-width:0; flex:1; }
  label { display:block; font-size:13px; font-weight:bold; margin-bottom:5px; }
  .quick { display:flex; margin-top:9px; }
  .quick button { border-width:2px; flex:1; margin-right:-2px; padding:7px 4px; font-size:12px; }
  .error { min-height:20px; margin-top:9px; color:var(--blue); font-size:12px; font-weight:bold; }
  .readout { border:3px solid var(--black); margin:19px 0 0; padding:21px 10px; background:var(--paper); text-align:center; }
  .timer-time { font-size:clamp(40px,7vw,84px); letter-spacing:-.13em; line-height:1; white-space:nowrap; font-variant-numeric:tabular-nums; }
  .status { margin-top:13px; font-size:12px; font-weight:bold; text-transform:uppercase; }
  .progress { height:12px; border:2px solid var(--black); background:var(--white); margin-top:16px; }
  .progress-fill { width:100%; height:100%; background:var(--blue); }
  .end-line,.last { display:flex; justify-content:space-between; gap:10px; font-size:12px; padding-top:12px; }
  .actions { display:flex; margin-top:22px; }
  .actions button { flex:1; margin-right:-3px; min-height:48px; }
  .reminder-card .readout { background:var(--blue); color:var(--white); border-color:var(--black); }
  .reminder-card .timer-time { font-size:clamp(38px,5.6vw,64px); }
  .reminder-card .last { border-top:2px solid var(--black); margin-top:23px; }
  .footer { border-top:8px solid var(--black); padding:20px 30px 40px; display:flex; justify-content:space-between; gap:30px; font-size:12px; }
  .toast-region { position:fixed; right:18px; bottom:18px; width:min(390px,calc(100% - 36px)); z-index:5; }
  .toast { padding:17px; border:4px solid var(--black); background:var(--blue); color:var(--white); font-weight:bold; margin-top:8px; }
  [hidden] { display:none !important; }
  @media (max-width:900px) { .board { grid-template-columns:1fr 1fr; } .reminder-card { grid-column:1 / -1; margin-left:12vw; transform:translateY(0); } .clock-card { transform:translateY(0); } }
  @media (max-width:600px) { body { border-width:8px; } .masthead { padding:20px 16px; display:block; min-height:0; } .masthead p { margin:19px 0; } .nav { justify-content:start; } .rail { padding:8px 16px; } .board { display:block; padding:0 16px 35px; } .card,.clock-card,.reminder-card { margin:20px 0 0; transform:none; } .footer { padding:18px 16px 26px; display:block; } .footer p+ p{ margin-top:13px; } }
</style>
</head>
<body>
<header class="masthead">
  <div><h1>计时器</h1><p>把时间摆在桌面上。开始、暂停、提醒。没有多余的包装。</p></div>
  <nav class="nav" aria-label="页面操作"><button id="sound" aria-pressed="true">声音：开</button><button id="test-sound">试听</button><button id="restore">重置布局</button></nav>
</header>
<div class="rail"><span>01 / 本地时钟</span><span>02 / 倒计时</span><span>03 / 间隔提醒</span><span>所有设置会保留在本浏览器</span></div>
<main class="board">
  <section class="card clock-card" data-card="clock">
    <header class="card-head"><h2>本地时钟</h2><div class="tools"><button class="fold" aria-expanded="true">收起</button></div></header>
    <div class="body"><div id="clock" class="clock-face" aria-label="当前时间">--:--:--</div><div class="clock-meta"><span>设备时间</span><span id="zone">UTC+08:00</span></div></div>
  </section>
  <section class="card timer-card" data-card="timer">
    <header class="card-head"><h2>倒计时</h2><div class="tools"><button class="fold" aria-expanded="true">收起</button></div></header>
    <div class="body">
      <div class="tabs"><button id="duration-tab" aria-pressed="true">时长</button><button id="deadline-tab" aria-pressed="false">定点</button></div>
      <div id="duration-box"><div class="fields"><div class="field"><label for="hours">时</label><input id="hours" type="number" min="0" max="999" value="0"></div><div class="field"><label for="minutes">分</label><input id="minutes" type="number" min="0" max="59" value="25"></div><div class="field"><label for="seconds">秒</label><input id="seconds" type="number" min="0" max="59" value="0"></div></div><div class="quick"><button data-min="5">5分</button><button data-min="15">15分</button><button data-min="25">25分</button></div></div>
      <div id="deadline-box" hidden><div class="fields"><div class="field"><label for="date">YYYY-MM-DD</label><input id="date" type="text" inputmode="numeric" placeholder="2026-10-27" pattern="\d{4}-\d{2}-\d{2}"></div><div class="field"><label for="time">时刻</label><input id="time" type="time" step="1"></div></div></div>
      <p class="error" id="timer-error" aria-live="polite"></p>
      <div class="readout"><div id="timer-readout" class="timer-time">00:25:00</div><p class="status" id="timer-status">待开始</p></div>
      <div class="progress"><div class="progress-fill" id="progress"></div></div><div class="end-line"><span>结束于</span><span id="ends">—</span></div>
      <div class="actions"><button class="primary" id="timer-action">开始</button><button id="timer-reset">重置</button></div>
    </div>
  </section>
  <section class="card reminder-card" data-card="reminder">
    <header class="card-head"><h2>间隔提醒</h2><div class="tools"><button class="fold" aria-expanded="true">收起</button></div></header>
    <div class="body"><div class="fields"><div class="field"><label for="interval">每隔</label><input id="interval" type="number" min="1" max="999" value="5"></div><div class="field"><label for="unit"> </label><select id="unit"><option value="1000">秒</option><option value="60000" selected>分钟</option><option value="3600000">小时</option></select></div></div><p class="error" id="reminder-error" aria-live="polite"></p>
      <div class="readout"><div>下次提醒</div><div id="reminder-readout" class="timer-time">00:05:00</div><p class="status" id="reminder-status">未启动</p></div><div class="actions"><button class="primary" id="reminder-action">启动提醒</button></div><div class="last"><span>最近提醒</span><span id="last">—</span></div>
    </div>
  </section>
</main>
<footer class="footer"><p>提醒需要页面保持打开。</p><p>黑 / 白 / 克莱因蓝。功能优先。</p></footer>
<div class="toast-region" id="toasts" role="status" aria-live="polite"></div>
<script>
(() => {
  const $=id=>document.getElementById(id), key='brutal-timer-v1', pad=n=>String(n).padStart(2,'0');
  const fmt=ms=>{const s=Math.max(0,Math.ceil(ms/1000));return `${pad(Math.floor(s/3600))}:${pad(Math.floor(s/60)%60)}:${pad(s%60)}`};
  const valid=v=>/^\d+$/.test(v)&&Number(v)>0;
  let state={sound:true,mode:'duration',timer:{status:'idle',end:0,total:1500000,remain:1500000},reminder:{run:false,next:0,period:300000,last:0},fold:{}};
  try { state={...state,...JSON.parse(localStorage.getItem(key))}; } catch {}
  const save=()=>localStorage.setItem(key,JSON.stringify(state));
  function note(t){const n=document.createElement('div');n.className='toast';n.textContent=t;$('toasts').append(n);setTimeout(()=>n.remove(),5000);beep();}
  let ac; function beep(){if(!state.sound)return;try{ac||=new AudioContext();const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=740;g.gain.setValueAtTime(.12,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.35);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+.36)}catch{}}
  function duration(){const h=$('hours').value,m=$('minutes').value,s=$('seconds').value;if(![h,m,s].every(x=>/^\d+$/.test(x))||+m>59||+s>59)return null;const n=(+h*3600 + +m*60 + +s)*1000;return n||null;}
  function deadline(){const d=$('date').value,t=$('time').value;if(!/^\d{4}-\d{2}-\d{2}$/.test(d)||!/^\d{2}:\d{2}(:\d{2})?$/.test(t))return null;const end=new Date(`${d}T${t}`).getTime();return end>Date.now()?end:null;}
  function setMode(m){if(state.timer.status==='running')return;state.mode=m;$('duration-box').hidden=m!=='duration';$('deadline-box').hidden=m!=='deadline';$('duration-tab').setAttribute('aria-pressed',m==='duration');$('deadline-tab').setAttribute('aria-pressed',m==='deadline');state.timer.status='idle';save();render();}
  $('duration-tab').onclick=()=>setMode('duration');$('deadline-tab').onclick=()=>setMode('deadline');
  document.querySelectorAll('[data-min]').forEach(b=>b.onclick=()=>{$('hours').value=0;$('minutes').value=b.dataset.min;$('seconds').value=0;state.timer.status='idle';render();save();});
  $('timer-action').onclick=()=>{const now=Date.now(),t=state.timer;if(t.status==='running'){t.remain=Math.max(0,t.end-now);t.status='paused'}else if(t.status==='paused'){t.end=now+t.remain;t.status='running'}else {const target=state.mode==='duration'?duration():deadline();if(!target){$('timer-error').textContent=state.mode==='duration'?'请输入有效的正时长。':'请选择未来的日期和时刻。';return;}t.total=state.mode==='duration'?target:target-now;t.end=state.mode==='duration'?now+target:target;t.remain=t.total;t.status='running';$('timer-error').textContent='';}save();render();};
  $('timer-reset').onclick=()=>{state.timer={status:'idle',end:0,total:duration()||1500000,remain:duration()||1500000};save();render();};
  $('reminder-action').onclick=()=>{const n=$('interval').value,unit=+$('unit').value;if(state.reminder.run){state.reminder.run=false}else if(valid(n)){state.reminder={run:true,period:+n*unit,next:Date.now()+(+n*unit),last:state.reminder.last||0};$('reminder-error').textContent=''}else{$('reminder-error').textContent='请输入 1–999 的整数。';return;}save();render();};
  $('sound').onclick=()=>{state.sound=!state.sound;$('sound').textContent=`声音：${state.sound?'开':'关'}`;$('sound').setAttribute('aria-pressed',state.sound);save();};$('test-sound').onclick=()=>{beep();note('提示音测试');};
  document.querySelectorAll('.fold').forEach(b=>b.onclick=()=>{const c=b.closest('.card'),id=c.dataset.card;c.classList.toggle('collapsed');state.fold[id]=c.classList.contains('collapsed');b.textContent=state.fold[id]?'展开':'收起';b.setAttribute('aria-expanded',!state.fold[id]);save();});
  $('restore').onclick=()=>{state.fold={};document.querySelectorAll('.card').forEach(c=>c.classList.remove('collapsed'));document.querySelectorAll('.fold').forEach(b=>{b.textContent='收起';b.setAttribute('aria-expanded','true')});save();note('布局已重置');};
  function render(){const now=Date.now(),t=state.timer,r=state.reminder;if(t.status==='running'&&t.end<=now){t.status='done';t.remain=0;save();note('倒计时结束。')}if(r.run&&r.next<=now){r.last=now;r.next+=Math.floor((now-r.next)/r.period+1)*r.period;save();note('间隔提醒。')}
    const remain=t.status==='running'?Math.max(0,t.end-now):t.status==='paused'?t.remain:t.status==='idle'?(state.mode==='duration'?(duration()||0):Math.max(0,(deadline()||now)-now)):0;
    $('timer-readout').textContent=fmt(remain);$('timer-status').textContent={idle:'待开始',running:'进行中',paused:'已暂停',done:'已结束'}[t.status];$('timer-action').textContent=t.status==='running'?'暂停':t.status==='paused'?'继续':t.status==='done'?'再次开始':'开始';$('progress').style.width=`${Math.max(0,Math.min(100,(t.total?remain/t.total:1)*100))}%`;$('ends').textContent=t.status==='running'||t.status==='paused'?new Date(t.status==='running'?t.end:now+t.remain).toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}):'—';
    const rr=r.run?Math.max(0,r.next-now):(+$('interval').value||0)*(+$('unit').value||0);$('reminder-readout').textContent=fmt(rr);$('reminder-status').textContent=r.run?'运行中':'未启动';$('reminder-action').textContent=r.run?'停止提醒':'启动提醒';$('last').textContent=r.last?new Date(r.last).toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}):'—';
  }
  function clock(){const d=new Date();$('clock').textContent=d.toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false});}
  const z=-new Date().getTimezoneOffset(),sg=z>=0?'+':'-';$('zone').textContent=`UTC${sg}${pad(Math.floor(Math.abs(z)/60))}:${pad(Math.abs(z)%60)}`;
  ['hours','minutes','seconds','date','time','interval','unit'].forEach(id=>$(id).addEventListener('input',render));
  for(const [id,on] of Object.entries(state.fold)){if(on){const c=document.querySelector(`[data-card="${id}"]`);if(c){c.classList.add('collapsed');c.querySelector('.fold').textContent='展开';c.querySelector('.fold').setAttribute('aria-expanded','false')}}}
  $('sound').textContent=`声音：${state.sound?'开':'关'}`;$('sound').setAttribute('aria-pressed',state.sound);setMode(state.mode);render();clock();setInterval(()=>{clock();render()},250);
})();
</script>
</body>
</html>
